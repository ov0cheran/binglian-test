<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>病恋风格深度测试</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      background: #0b0b14;
      color: #e5e5e5;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* ========== 年龄确认弹窗 ========== */
    #age-modal {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.8);
      z-index: 100;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    #age-modal.hidden {
      display: none;
    }
    .age-modal-content {
      background: #1a1a2e;
      border: 1px solid #6a5acd;
      border-radius: 16px;
      padding: 30px;
      text-align: center;
      max-width: 400px;
      box-shadow: 0 0 30px rgba(155,126,221,0.4);
    }
    .age-modal-content h2 {
      color: #c0b0ff;
      margin-bottom: 15px;
      font-size: 22px;
    }
    .age-modal-content p {
      color: #ccc;
      font-size: 14px;
      line-height: 1.6;
      margin-bottom: 20px;
    }
    .age-modal-btns {
      display: flex;
      gap: 15px;
      justify-content: center;
    }
    .age-modal-btn {
      padding: 10px 25px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 15px;
      letter-spacing: 1px;
      transition: background 0.2s;
    }
    .age-modal-btn.confirm {
      background: #6a5acd;
      color: white;
    }
    .age-modal-btn.confirm:hover {
      background: #7d6dd8;
    }
    .age-modal-btn.cancel {
      background: #2a2a50;
      color: #e0e0e0;
    }
    .age-modal-btn.cancel:hover {
      background: #3a3a60;
    }

    /* ========== 首页 ========== */
    #home-page {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      background: radial-gradient(circle at 50% 40%, #1a1a3a 0%, #0b0b14 70%);
      z-index: 10;
      transition: opacity 0.5s;
      overflow: hidden;
    }
    #home-page.hidden {
      opacity: 0;
      pointer-events: none;
    }
    #particleCanvas {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      pointer-events: none;
      z-index: 1;
    }
    .home-content {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: 0 30px;
    }
    .home-title {
      font-size: 48px;
      font-weight: 700;
      letter-spacing: 6px;
      background: linear-gradient(90deg, #c0b0ff, #f0e6ff, #9b7edd, #f0e6ff, #c0b0ff);
      background-size: 300% 100%;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      animation: gradientShift 4s ease-in-out infinite, breathe 3s ease-in-out infinite;
      text-shadow: 0 0 30px rgba(155,126,221,0.4);
      margin-bottom: 20px;
      white-space: nowrap;
    }
    @keyframes gradientShift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
    @keyframes breathe {
      0%,100% { filter: brightness(1); }
      50% { filter: brightness(1.3); }
    }
    .home-sub {
      font-size: 18px;
      color: #aaa;
      letter-spacing: 2px;
      min-height: 28px;
      margin-bottom: 10px;
    }
    .home-sub::after {
      content: '|';
      animation: blink 0.8s infinite;
      color: #9b7edd;
    }
    @keyframes blink {
      0%,100% { opacity: 1; }
      50% { opacity: 0; }
    }
    .home-disclaimer {
      margin-top: 15px;
      font-size: 12px;
      color: #888;
      letter-spacing: 1px;
      line-height: 1.6;
      max-width: 480px;
    }
    .home-hint {
      margin-top: 40px;
      font-size: 14px;
      color: #888;
      animation: pulse 2s infinite;
      letter-spacing: 2px;
    }
    @keyframes pulse {
      0%,100% { opacity: 0.4; }
      50% { opacity: 1; }
    }

    /* ========== 问卷页 ========== */
    #quiz-page {
      display: none;
      padding: 0 20px 30px;
      max-width: 680px;
      margin: 0 auto;
    }
    #quiz-page.show {
      display: block;
    }
    .progress-wrapper {
      position: sticky;
      top: 0;
      z-index: 5;
      background: #0b0b14;
      padding: 20px 0 10px;
    }
    .progress-bar {
      width: 100%;
      height: 4px;
      background: #1e1e38;
      border-radius: 2px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #6a5acd, #9b7edd, #c0b0ff);
      border-radius: 2px;
      transition: width 0.4s ease;
      width: 0%;
    }
    .progress-text {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
      font-size: 13px;
      color: #888;
      letter-spacing: 1px;
    }
    .progress-percent {
      color: #9b7edd;
      font-weight: 600;
    }
    .quiz-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
    }
    .page-indicator {
      font-size: 14px;
      color: #888;
      letter-spacing: 1px;
    }
    .question-card {
      background: #151526;
      border-radius: 12px;
      padding: 25px;
      margin-bottom: 20px;
      border-left: 3px solid #6a5acd;
      transition: border-color 0.3s, opacity 0.3s, transform 0.3s;
      animation: cardFadeIn 0.4s ease;
    }
    @keyframes cardFadeIn {
      from { opacity: 0; transform: translateY(15px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .question-card:hover {
      border-left-color: #9b7edd;
    }
    .question-text {
      font-size: 17px;
      line-height: 1.6;
      margin-bottom: 15px;
      color: #f0f0f0;
    }
    .options {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .option-label {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 16px;
      background: #1e1e38;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s;
      border: 1px solid transparent;
    }
    .option-label:hover {
      background: #282848;
      border-color: #6a5acd;
    }
    .option-label.selected {
      background: #2a2a50;
      border-color: #9b7edd;
      box-shadow: 0 0 10px rgba(155,126,221,0.3);
    }
    .option-label input[type="radio"] {
      appearance: none;
      width: 18px;
      height: 18px;
      border: 2px solid #6a5acd;
      border-radius: 50%;
      position: relative;
      flex-shrink: 0;
      cursor: pointer;
    }
    .option-label input[type="radio"]:checked::after {
      content: '';
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: 10px; height: 10px;
      background: #9b7edd;
      border-radius: 50%;
    }
    .option-text {
      font-size: 15px;
      color: #ddd;
    }
    .quiz-nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 30px;
    }
    .nav-btn {
      padding: 12px 28px;
      background: #2a2a50;
      color: #e0e0e0;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 15px;
      letter-spacing: 1px;
      transition: background 0.2s;
      min-width: 100px;
    }
    .nav-btn:hover {
      background: #3a3a60;
    }
    .nav-btn:disabled {
      opacity: 0.3;
      cursor: not-allowed;
    }
    .submit-btn {
      background: #6a5acd;
      color: white;
    }
    .submit-btn:hover {
      background: #7d6dd8;
    }

    /* ========== 结果页 ========== */
    #result-page {
      display: none;
      padding: 30px 20px;
      max-width: 900px;
      margin: 0 auto;
    }
    #result-page.show {
      display: block;
    }
    .result-title {
      text-align: center;
      font-size: 24px;
      color: #c0b0ff;
      letter-spacing: 2px;
      margin-bottom: 20px;
    }
    .style-card {
      position: relative;
      text-align: center;
      padding: 40px 20px 30px;
      background: linear-gradient(145deg, #1e1a38 0%, #0d0d1a 50%, #1a1a32 100%);
      border-radius: 20px;
      margin-bottom: 25px;
      border: 1px solid #6a5acd;
      box-shadow: 
        0 0 30px rgba(155,126,221,0.25),
        inset 0 0 60px rgba(155,126,221,0.05),
        0 0 80px rgba(155,126,221,0.1);
      overflow: hidden;
    }
    .style-card::before {
      content: '';
      position: absolute;
      top: -2px; left: -2px; right: -2px; bottom: -2px;
      border-radius: 21px;
      background: linear-gradient(135deg, #6a5acd, #9b7edd, #e94560, #9b7edd, #6a5acd);
      background-size: 400% 400%;
      z-index: -1;
      opacity: 0.5;
      animation: gradientBorder 6s ease-in-out infinite;
    }
    @keyframes gradientBorder {
      0%,100% { background-position: 0% 50%; opacity: 0.4; }
      50% { background-position: 100% 50%; opacity: 0.7; }
    }
    .style-card-symbol {
      font-size: 70px;
      line-height: 1;
      margin-bottom: 15px;
      animation: symbolFloat 3s ease-in-out infinite;
      text-shadow: 0 0 20px rgba(200,150,255,0.7);
    }
    @keyframes symbolFloat {
      0%,100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }
    .style-card-name {
      font-size: 28px;
      font-weight: 700;
      color: #f0e6ff;
      margin-bottom: 15px;
      letter-spacing: 2px;
      text-shadow: 0 0 20px rgba(200,150,255,0.6);
    }
    .style-card-tags {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
      margin-top: 10px;
    }
    .style-tag {
      padding: 5px 14px;
      background: rgba(42,42,80,0.8);
      border-radius: 20px;
      font-size: 13px;
      color: #c0b0ff;
      border: 1px solid #6a5acd;
      backdrop-filter: blur(4px);
    }
    .result-section {
      background: #151526;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 15px;
    }
    .result-section h3 {
      font-size: 18px;
      color: #9b7edd;
      margin-bottom: 12px;
      letter-spacing: 1px;
      border-bottom: 1px solid #2a2a50;
      padding-bottom: 8px;
    }
    .result-text {
      font-size: 15px;
      line-height: 1.8;
      color: #ccc;
    }
    .result-text p {
      margin-bottom: 12px;
    }
    .chart-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-top: 15px;
    }
    .chart-box {
      background: #151526;
      border-radius: 12px;
      padding: 15px;
    }
    .chart-box h4 {
      text-align: center;
      font-size: 16px;
      color: #c0b0ff;
      margin-bottom: 10px;
    }
    .chart-container {
      position: relative;
      width: 100%;
      height: 250px;
      margin: 0 auto;
    }
    .chart-container canvas {
      display: block;
      width: 100% !important;
      height: 100% !important;
    }
    .score-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 8px;
    }
    .score-item {
      display: flex;
      justify-content: space-between;
      background: #1e1e38;
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 14px;
      color: #bbb;
    }
    .score-item .type-name {
      color: #ddd;
    }
    .score-item .type-score {
      color: #c0b0ff;
      font-weight: bold;
    }
    .special-note {
      background: #2a1a2a;
      border-left: 3px solid #e94560;
      padding: 10px 15px;
      border-radius: 6px;
      margin-top: 8px;
      color: #ffb3c0;
    }
    .copy-btn {
      display: block;
      margin: 30px auto 0;
      padding: 12px 30px;
      background: #2a2a50;
      color: #e0e0e0;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 15px;
      letter-spacing: 1px;
      transition: background 0.2s;
    }
    .copy-btn:hover {
      background: #3a3a60;
    }
    .copy-btn.copied {
      background: #2d5a3a;
      color: #d0ffd0;
    }
    .back-home {
      display: block;
      margin: 10px auto 0;
      padding: 12px 30px;
      background: #2a2a50;
      color: #e0e0e0;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 15px;
      letter-spacing: 1px;
    }
    .back-home:hover {
      background: #3a3a60;
    }
    .footer-stats {
      text-align: center;
      margin-top: 20px;
      font-size: 11px;
      color: #555;
      letter-spacing: 0.5px;
    }
    .footer-stats span {
      margin: 0 4px;
    }
    @media (max-width: 700px) {
      .chart-grid {
        grid-template-columns: 1fr;
      }
      .chart-container {
        height: 220px;
      }
      .home-title {
        font-size: 32px;
        letter-spacing: 3px;
        white-space: normal;
      }
      .style-card-symbol {
        font-size: 50px;
      }
    }
  </style>
</head>
<body>

  <!-- 年龄确认弹窗 -->
  <div id="age-modal">
    <div class="age-modal-content">
      <h2>温馨提示</h2>
      <p>本测试仅供成年人娱乐，不构成任何情感建议或指导。结果分析基于娱乐性问卷，不反映真实心理状态。请勿模仿其中任何不当行为。如果你在关系中感到痛苦或被控制，请寻求专业帮助。</p>
      <div class="age-modal-btns">
        <button class="age-modal-btn confirm" onclick="confirmAge()">我已满18岁，继续</button>
        <button class="age-modal-btn cancel" onclick="cancelAge()">离开</button>
      </div>
    </div>
  </div>

  <!-- 首页 -->
  <div id="home-page">
    <canvas id="particleCanvas"></canvas>
    <div class="home-content">
      <div class="home-title">病恋风格深度测试</div>
      <div class="home-sub" id="typewriter"></div>
      <div class="home-disclaimer">本测试仅供娱乐参考，不构成任何建议和不良引导。测试结果不能作为心理诊断依据，请理性看待。</div>
      <div class="home-hint">点击任意处开始</div>
    </div>
  </div>

  <!-- 问卷页 -->
  <div id="quiz-page">
    <div class="progress-wrapper">
      <div class="progress-text">
        <span class="page-indicator" id="pageIndicator">第 1 / 5 页</span>
        <span class="progress-percent" id="progressPercent">20%</span>
      </div>
      <div class="progress-bar">
        <div class="progress-fill" id="progressFill"></div>
      </div>
    </div>
    <div id="questionsContainer"></div>
    <div class="quiz-nav">
      <button class="nav-btn" id="prevBtn" onclick="prevPage()">上一页</button>
      <button class="nav-btn submit-btn" id="submitBtn" onclick="submitQuiz()">提交测试</button>
      <button class="nav-btn" id="nextBtn" onclick="nextPage()">下一页</button>
    </div>
  </div>

  <!-- 结果页 -->
  <div id="result-page">
    <div class="result-title">你的病恋风格测试结果</div>

    <!-- 主风格卡 -->
    <div class="style-card">
      <div class="style-card-symbol" id="styleCardSymbol">✦</div>
      <div class="style-card-name" id="styleCardName"></div>
      <div class="style-card-tags" id="styleCardTags"></div>
    </div>

    <!-- 图表区域：权力位置雷达图 + 情感内核柱状图 -->
    <div class="chart-grid">
      <div class="chart-box">
        <h4>权力位置得分</h4>
        <div class="chart-container">
          <canvas id="chartPower"></canvas>
        </div>
      </div>
      <div class="chart-box">
        <h4>情感内核得分</h4>
        <div class="chart-container">
          <canvas id="chartEmotion"></canvas>
        </div>
      </div>
    </div>

    <div id="resultContent"></div>

    <button class="copy-btn" id="copyBtn" onclick="copyResult()">复制结果</button>
    <button class="back-home" onclick="backToHome()">重新测试</button>

    <!-- 底部低调统计 -->
    <div class="footer-stats">
      <span id="busuanzi_container_site_pv">总访问量 <span id="busuanzi_value_site_pv"></span></span>
      <span>|</span>
      <span id="busuanzi_container_site_uv">访客数 <span id="busuanzi_value_site_uv"></span></span>
    </div>
  </div>

  <script>
    // ==================== 年龄确认 ====================
    function confirmAge() {
      document.getElementById('age-modal').classList.add('hidden');
    }
    function cancelAge() {
      window.location.href = 'about:blank';
    }

    // ==================== 粒子背景系统 ====================
    const particleCanvas = document.getElementById('particleCanvas');
    const ctx2d = particleCanvas.getContext('2d');
    let particles = [];
    let particleAnimationId = null;

    function initParticles() {
      const rect = particleCanvas.parentElement.getBoundingClientRect();
      particleCanvas.width = rect.width;
      particleCanvas.height = rect.height;
      particles = [];
      const count = Math.min(80, Math.floor(rect.width * rect.height / 15000));
      for (let i = 0; i < count; i++) {
        particles.push(new Particle(particleCanvas));
      }
    }

    class Particle {
      constructor(canvas) {
        this.canvas = canvas;
        this.reset();
      }
      reset() {
        this.x = Math.random() * this.canvas.width;
        this.y = Math.random() * this.canvas.height;
        this.size = Math.random() * 2.5 + 0.5;
        this.speedX = (Math.random() - 0.5) * 0.3;
        this.speedY = -Math.random() * 0.5 - 0.1;
        this.opacity = Math.random() * 0.5 + 0.2;
        this.color = this.getRandomColor();
      }
      getRandomColor() {
        const colors = ['#9b7edd', '#6a5acd', '#c0b0ff', '#7d6dd8', '#5a4a9d'];
        return colors[Math.floor(Math.random() * colors.length)];
      }
      update() {
        this.x += this.speedX;
        this.y += this.speedY;
        if (this.y < -10) {
          this.reset();
          this.y = this.canvas.height + 10;
        }
        if (this.x < -10) this.x = this.canvas.width + 10;
        if (this.x > this.canvas.width + 10) this.x = -10;
      }
      draw(ctx) {
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fillStyle = this.color;
        ctx.globalAlpha = this.opacity;
        ctx.fill();
        ctx.globalAlpha = 1;
      }
    }

    function startParticleAnimation() {
      if (particleAnimationId) return;
      function animate() {
        ctx2d.clearRect(0, 0, particleCanvas.width, particleCanvas.height);
        particles.forEach(p => {
          p.update();
          p.draw(ctx2d);
        });
        particleAnimationId = requestAnimationFrame(animate);
      }
      animate();
    }

    function stopParticleAnimation() {
      if (particleAnimationId) {
        cancelAnimationFrame(particleAnimationId);
        particleAnimationId = null;
      }
      ctx2d.clearRect(0, 0, particleCanvas.width, particleCanvas.height);
    }

    // ==================== 打字机效果 ====================
    const typewriterElement = document.getElementById('typewriter');
    let typewriterTimer = null;

    function startTypewriter() {
      if (typewriterTimer) clearTimeout(typewriterTimer);
      const text = '探索你隐藏的情感倾向';
      let index = 0;
      typewriterElement.textContent = '';
      function type() {
        if (index < text.length) {
          typewriterElement.textContent += text.charAt(index);
          index++;
          typewriterTimer = setTimeout(type, 80);
        }
      }
      type();
    }

    // ==================== 音效系统 ====================
    let audioCtx = null;
    function ensureAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
    }
    function playClickSound() {
      ensureAudio();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.type = 'sine';
      osc.frequency.value = 800;
      gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.1);
      osc.start(audioCtx.currentTime);
      osc.stop(audioCtx.currentTime + 0.1);
    }
    function playSuccessSound() {
      ensureAudio();
      const osc1 = audioCtx.createOscillator();
      const osc2 = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc1.connect(gain);
      osc2.connect(gain);
      gain.connect(audioCtx.destination);
      osc1.type = 'sine';
      osc2.type = 'sine';
      osc1.frequency.value = 660;
      osc2.frequency.value = 880;
      gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.3);

        '日常': '你的表达方式自然随性，没有刻意的华丽或逻辑包装。你倾向于用日常话语表达情感，看似平淡，却能在不知不觉中让对方习惯你的存在，形成一种温水煮青蛙式的依赖。'
      }
    };

    // ==================== 状态变量 ====================
    const perPage = 5;
    const totalPages = Math.ceil(questions.length / perPage);
    let currentPage = 0;
    const answers = {};

    // ==================== 渲染函数 ====================
    function renderPage() {
      const container = document.getElementById('questionsContainer');
      container.innerHTML = '';
      const start = currentPage * perPage;
      const end = Math.min(start + perPage, questions.length);

      for (let i = start; i < end; i++) {
        const q = questions[i];
        const div = document.createElement('div');
        div.className = 'question-card';

        const p = document.createElement('p');
        p.className = 'question-text';
        p.textContent = q.question;
        div.appendChild(p);

        const optDiv = document.createElement('div');
        optDiv.className = 'options';
        q.options.forEach((opt, optIndex) => {
          const label = document.createElement('label');
          label.className = 'option-label';
          if (answers[i] === optIndex) {
            label.classList.add('selected');
          }
          const radio = document.createElement('input');
          radio.type = 'radio';
          radio.name = 'q' + i;
          radio.value = optIndex;
          radio.checked = answers[i] === optIndex;
          radio.addEventListener('change', function() {
            answers[i] = optIndex;
            playClickSound();
            const allLabels = optDiv.querySelectorAll('.option-label');
            allLabels.forEach(l => l.classList.remove('selected'));
            label.classList.add('selected');
          });
          label.appendChild(radio);
          const span = document.createElement('span');
          span.className = 'option-text';
          span.textContent = String.fromCharCode(65 + optIndex) + '. ' + opt.text;
          label.appendChild(span);
          optDiv.appendChild(label);
        });
        div.appendChild(optDiv);
        container.appendChild(div);
      }

      // 更新进度条
      const progressPercent = Math.round(((currentPage + 1) / totalPages) * 100);
      document.getElementById('pageIndicator').textContent = `第 ${currentPage + 1} / ${totalPages} 页`;
      document.getElementById('progressPercent').textContent = progressPercent + '%';
      document.getElementById('progressFill').style.width = progressPercent + '%';

      document.getElementById('prevBtn').disabled = currentPage === 0;
      document.getElementById('nextBtn').disabled = currentPage === totalPages - 1;
      document.getElementById('submitBtn').style.display = currentPage === totalPages - 1 ? 'inline-block' : 'none';
      document.getElementById('nextBtn').style.display = currentPage === totalPages - 1 ? 'none' : 'inline-block';
    }

    // ==================== 页面导航 ====================
    function nextPage() {
      if (currentPage < totalPages - 1) {
        currentPage++;
        renderPage();
        playClickSound();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }
    }
    function prevPage() {
      if (currentPage > 0) {
        currentPage--;
        renderPage();
        playClickSound();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }
    }

    // ==================== 图表实例管理 ====================
    let chartInstances = {};

    function destroyCharts() {
      Object.values(chartInstances).forEach(chart => {
        if (chart) chart.destroy();
      });
      chartInstances = {};
    }

    // ==================== 结果摘要（用于复制） ====================
    let lastResultSummary = '';

    // ==================== 生成详细解读 ====================
    function generateDetailedInterpretation(power, emotion, relation, expression, dogTag) {
      const paragraphs = [];

      paragraphs.push(
        `你的病恋风格组合为${[power.main, emotion.main, relation.main, expression.main, dogTag].filter(Boolean).join(' + ')}。这并非单一标签，而是由权力位置、情感内核、关系模式和表达形式四个维度交织而成的复杂情感倾向。在亲密关系中，你既受这些倾向的驱动，也可能在不同情境下表现出矛盾或切换。以下将逐一拆解你在各个维度的具体表现。`
      );

      if (power.main && detailedDescriptions.power[power.main]) {
        paragraphs.push(`【权力位置：${power.main}】${detailedDescriptions.power[power.main]}`);
      }
      if (power.aux && detailedDescriptions.power[power.aux]) {
        paragraphs.push(`同时，你具有明显的${power.aux}辅助倾向，这会在特定情境下软化或强化你的主导风格，使你的权力表现更具层次。`);
      }

      if (emotion.main && detailedDescriptions.emotion[emotion.main]) {
        paragraphs.push(`【情感内核：${emotion.main}】${detailedDescriptions.emotion[emotion.main]}`);
      }
      if (emotion.aux && detailedDescriptions.emotion[emotion.aux]) {
        paragraphs.push(`此外，${emotion.aux}作为辅助情感倾向，会在你情绪波动时浮现，与主情感相互拉扯，增添内在冲突。`);
      }

      if (relation.main && detailedDescriptions.relation[relation.main]) {
        paragraphs.push(`【关系模式：${relation.main}】${detailedDescriptions.relation[relation.main]}`);
      }
      if (relation.aux && detailedDescriptions.relation[relation.aux]) {
        paragraphs.push(`在关系建立与维持上，你还受到${relation.aux}模式的影响，这意味着你的控制手段并非单一，可能在不同阶段切换策略。`);
      }

      if (expression.main && detailedDescriptions.expression[expression.main]) {
        paragraphs.push(`【表达形式：${expression.main}】${detailedDescriptions.expression[expression.main]}`);
      }
      if (expression.aux && detailedDescriptions.expression[expression.aux]) {
        paragraphs.push(`辅助表达形式${expression.aux}会在你情绪波动或面对特定对象时显现，让你的表达方式更加多样。`);
      }

      if (dogTag) {
        paragraphs.push(`【附加标签：${dogTag}】你具备明显的小狗文学倾向，这表明你在关系中可能对“主/狗”角色有认同感，无论是掌控方还是服从方，你都享受这种带有忠诚、调教和信任色彩的特殊联结。`);
      }

      // 新增：正向引导
      paragraphs.push(`请注意，以上解读仅基于娱乐性问卷，不构成任何诊断或建议。健康的关系应建立在尊重、平等和自愿的基础上。如果你在关系中感到被控制、威胁或痛苦，请及时与信任的人沟通，或寻求专业心理支持。`);

      return paragraphs;
    }

    // ==================== 提交与结果 ====================
    function submitQuiz() {
      const missing = [];
      for (let i = 0; i < questions.length; i++) {
        if (!(i in answers)) missing.push(i);
      }
      if (missing.length > 0) {
        const firstMissingPage = Math.floor(missing[0] / perPage);
        currentPage = firstMissingPage;
        renderPage();
        alert('还有未完成的题目，请先回答本页所有问题。');
        return;
      }

      // 计分
      const scores = {
        上位:0, 下位:0, 高压:0, 平权:0,
        疯病:0, 温病:0, 低恋:0, 高恋:0, 伪高恋:0, 无恋:0, 水仙:0, 病虐:0,
        白骑士:0, 精控:0, 剖析:0, 钓系:0,
        小狗主:0, 小狗狗:0,
        文艺病:0, 意识流:0, 逻辑病:0, 日常:0
      };
      questions.forEach((q, i) => {
        const opt = q.options[answers[i]];
        if (opt.type && scores.hasOwnProperty(opt.type)) scores[opt.type] += 1;
      });

      const dimPower = ['上位','下位','高压','平权'];
      const dimEmotion = ['疯病','温病','低恋','高恋','伪高恋','无恋','水仙','病虐'];
      const dimRelation = ['白骑士','精控','剖析','钓系','小狗主','小狗狗'];
      const dimExpression = ['文艺病','意识流','逻辑病','日常'];

      function getMainAux(types) {
        let sorted = types.filter(t => scores[t] > 0).sort((a,b) => scores[b] - scores[a]);
        if (sorted.length === 0) return { main: '', aux: '' };
        const main = sorted[0];
        let aux = '';
        for (let i = 1; i < sorted.length; i++) {
          if (scores[sorted[i]] >= scores[main] * 0.7) { aux = sorted[i]; break; }
        }
        return { main, aux };
      }
      const power = getMainAux(dimPower);
      const emotion = getMainAux(dimEmotion);
      const relation = getMainAux(dimRelation);
      const expression = getMainAux(dimExpression);

      let dogTag = '';
      if (scores['小狗主'] >= 2) dogTag = '小狗文学·主';
      else if (scores['小狗狗'] >= 2) dogTag = '小狗文学·狗';
      else if (scores['小狗主'] + scores['小狗狗'] >= 3) dogTag = '小狗文学·主/狗混合';

      const specialNotes = [];
      if (Math.abs(scores['上位'] - scores['下位']) <= 1 && scores['上位'] > 0) specialNotes.push('权力切换型：你可能在支配与服从间切换。');
      if (scores['疯病'] >= 3 && scores['温病'] >= 3) specialNotes.push('冷热交替型：表面温和，内在极端。');
      if (scores['剖析'] >= 3 && scores['钓系'] >= 3) specialNotes.push('观察诱饵型：先分析再引诱。');
      if (scores['病虐'] >= 3 && scores['疯病'] >= 3) specialNotes.push('疼痛成瘾型：爱与痛高度捆绑。');

      // 组合名称：只用权力位置 + 情感内核
      const nameKey = `${power.main}+${emotion.main}`;
      const combinationText = combinationNames[nameKey] || `${power.main}${emotion.main}`;

      // 符号：拼接权力位置和情感内核的符号
      const powerSymbol = typeSymbolMap[power.main] || '';
      const emotionSymbol = typeSymbolMap[emotion.main] || '';
      const combinationSymbol = powerSymbol + emotionSymbol || '✧';

      const tagList = [];
      if (power.main) tagList.push(power.main);
      if (emotion.main) tagList.push(emotion.main);
      if (relation.main) tagList.push(relation.main);
      if (expression.main) tagList.push(expression.main);
      if (dogTag) tagList.push(dogTag);

      // 生成详细解读段落
      const detailParagraphs = generateDetailedInterpretation(power, emotion, relation, expression, dogTag);
      const detailHtml = detailParagraphs.map(p => `<p>${p}</p>`).join('');
      const detailText = detailParagraphs.join('\n\n');

      // 更新风格卡
      document.getElementById('styleCardName').textContent = combinationText;
      document.getElementById('styleCardSymbol').textContent = combinationSymbol;
      document.getElementById('styleCardTags').innerHTML = tagList.map(t => `<span class="style-tag">${t}</span>`).join('');

      const resultContent = document.getElementById('resultContent');
      let html = '';
      html += `<div class="result-section"><h3>风格解读</h3><div class="result-text">${detailHtml}</div></div>`;

      // 辅助倾向摘要
      const auxList = [];
      if (power.aux) auxList.push('权力位置辅助：' + power.aux);
      if (emotion.aux) auxList.push('情感内核辅助：' + emotion.aux);
      if (relation.aux) auxList.push('关系模式辅助：' + relation.aux);
      if (expression.aux) auxList.push('表达形式辅助：' + expression.aux);
      if (auxList.length > 0) {
        html += `<div class="result-section"><h3>辅助倾向摘要</h3><div class="result-text">${auxList.join('、')}</div></div>`;
      }

      // 特殊提示
      if (specialNotes.length > 0) {
        html += `<div class="result-section"><h3>特殊提示</h3>`;
        specialNotes.forEach(note => {
          html += `<div class="special-note">${note}</div>`;
        });
        html += `</div>`;
      }

      // 得分列表
      html += `<div class="result-section"><h3>各类型得分明细</h3><div class="score-grid">`;
      const allTypes = [...dimPower, ...dimEmotion, ...dimRelation, ...dimExpression];
      allTypes.forEach(t => {
        html += `<div class="score-item"><span class="type-name">${t}</span><span class="type-score">${scores[t] || 0}</span></div>`;
      });
      html += `</div></div>`;

      resultContent.innerHTML = html;

      // 构建复制摘要
      lastResultSummary = 
        '【病恋风格深度测试结果】\n' +
        '组合名称：' + combinationText + '\n' +
        '符号：' + combinationSymbol + '\n' +
        '标签：' + tagList.join('、') + '\n\n' +
        '风格解读：\n' + detailText + '\n\n' +
        '权力位置得分：' + dimPower.map(t => t + ' ' + (scores[t]||0) + '分').join('、') + '\n' +
        '情感内核得分：' + dimEmotion.map(t => t + ' ' + (scores[t]||0) + '分').join('、') + '\n' +
        '关系模式得分：' + dimRelation.map(t => t + ' ' + (scores[t]||0) + '分').join('、') + '\n' +
        '表达形式得分：' + dimExpression.map(t => t + ' ' + (scores[t]||0) + '分').join('、') +
        (auxList.length > 0 ? '\n\n辅助倾向摘要：' + auxList.join('、') : '') +
        (specialNotes.length > 0 ? '\n\n特殊提示：' + specialNotes.join('、') : '');

      // 绘制图表
      drawCharts(scores, dimPower, dimEmotion);

      // 切换页面
      document.getElementById('quiz-page').classList.remove('show');
      document.getElementById('result-page').classList.add('show');
      playSuccessSound();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function drawCharts(scores, dimPower, dimEmotion) {
      destroyCharts();

      // 雷达图（权力位置）
      const ctxPower = document.getElementById('chartPower').getContext('2d');
      chartInstances.power = new Chart(ctxPower, {
        type: 'radar',
        data: {
          labels: dimPower,
          datasets: [{
            label: '得分',
            data: dimPower.map(t => scores[t] || 0),
            backgroundColor: 'rgba(155,126,221,0.3)',
            borderColor: '#9b7edd',
            borderWidth: 2,
            pointBackgroundColor: '#c0b0ff',
            pointBorderColor: '#fff',
            pointRadius: 4
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          scales: {
            r: {
              beginAtZero: true,
              max: 6,
              ticks: { stepSize: 1, color: '#888' },
              grid: { color: '#2a2a50' },
              angleLines: { color: '#2a2a50' },
              pointLabels: { color: '#ddd', font: { size: 13 } }
            }
          },
          plugins: { legend: { display: false } }
        }
      });

      // 柱状图（情感内核）
      const ctxEmotion = document.getElementById('chartEmotion').getContext('2d');
      chartInstances.emotion = new Chart(ctxEmotion, {
        type: 'bar',
        data: {
          labels: dimEmotion,
          datasets: [{
            label: '得分',
            data: dimEmotion.map(t => scores[t] || 0),
            backgroundColor: 'rgba(155,126,221,0.7)',
            borderColor: '#9b7edd',
            borderWidth: 1,
            borderRadius: 4
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          scales: {
            y: {
              beginAtZero: true,
              ticks: { stepSize: 1, color: '#888' },
              grid: { color: '#2a2a50' }
            },
            x: {
              ticks: { color: '#ddd', font: { size: 12 } },
              grid: { color: '#2a2a50' }
            }
          },
          plugins: { legend: { display: false } }
        }
      });
    }

    // ==================== 复制结果 ====================
    function copyResult() {
      if (!lastResultSummary) return;
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(lastResultSummary).then(() => {
          const btn = document.getElementById('copyBtn');
          btn.textContent = '已复制';
          btn.classList.add('copied');
          setTimeout(() => {
            btn.textContent = '复制结果';
            btn.classList.remove('copied');
          }, 1500);
        }).catch(() => {
          fallbackCopy();
        });
      } else {
        fallbackCopy();
      }
    }
    function fallbackCopy() {
      const textarea = document.createElement('textarea');
      textarea.value = lastResultSummary;
      textarea.style.position = 'fixed';
      textarea.style.opacity = '0';
      document.body.appendChild(textarea);
      textarea.select();
      document.execCommand('copy');
      document.body.removeChild(textarea);
      const btn = document.getElementById('copyBtn');
      btn.textContent = '已复制';
      btn.classList.add('copied');
      setTimeout(() => {
        btn.textContent = '复制结果';
        btn.classList.remove('copied');
      }, 1500);
    }

    // ==================== 首页与返回 ====================
    function enterQuiz() {
      document.getElementById('home-page').classList.add('hidden');
      document.getElementById('quiz-page').classList.add('show');
      stopParticleAnimation();
      renderPage();
      playClickSound();
    }
    function backToHome() {
      for (let key in answers) delete answers[key];
      currentPage = 0;
      destroyCharts();
      document.getElementById('result-page').classList.remove('show');
      document.getElementById('home-page').classList.remove('hidden');
      document.getElementById('quiz-page').classList.remove('show');
      startTypewriter();
      initParticles();
      startParticleAnimation();
      playClickSound();
    }

    // ==================== 初始化 ====================
    document.getElementById('home-page').addEventListener('click', enterQuiz);
    window.addEventListener('resize', () => {
      if (!document.getElementById('home-page').classList.contains('hidden')) {
        initParticles();
        if (particleAnimationId) {
          stopParticleAnimation();
          startParticleAnimation();
        }
      }
    });

    initParticles();
    startParticleAnimation();
    startTypewriter();
  </script>
  <!-- 不蒜子访问统计 -->
  <script async src="//busuanzi.ibruce.info/busuanzi/2.3/busuanzi.pure.mini.js"></script>
